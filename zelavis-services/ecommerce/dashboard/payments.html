<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Payments</title>
  <style>
    .row { display:flex; gap:.75rem; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .webhook { display:flex; gap:.5rem; flex-wrap:wrap; } .webhook input { min-width:0; flex:1 1 16rem; padding:.5rem; }
    .provider { display:grid; gap:.75rem; } .error { color:var(--destructive); } code, #failures p { overflow-wrap:anywhere; }
  </style>
</head>
<body>
<main class="zv-stack">
  <section class="zv-card zv-stack"><h2>Active gateways</h2><p id="active-hint" role="status">Loading…</p><div id="active" class="zv-stack"></div></section>
  <section class="zv-card zv-stack"><h2>Payment plugins</h2><p id="catalogue-hint"></p><div id="catalogue" class="zv-stack"></div></section>
  <section class="zv-card zv-stack"><h2>Fulfillment failures</h2><p id="failures-hint" role="status">Loading…</p><div id="failures" class="zv-stack"></div><button id="more" class="zv-button" hidden>Load more</button></section>
</main>
<script type="module">
  import { createPageApi, Effect } from "./api.js";
  const api = createPageApi("ecommerce"), el = id => document.getElementById(id);
  const text = (tag, value) => { const node = document.createElement(tag); node.textContent = value; return node; };
  const showError = id => error => Effect.sync(() => { el(id).textContent = error.message || "Could not load payments."; el(id).classList.add("error"); });
  Effect.runFork(Effect.gen(function* () {
    const { providers, plugins } = yield* api("payments/providers");
    el("active-hint").textContent = providers.length ? "Use each webhook address in its payment provider. For a Project, use its public hostname with the shown path." : "No payment gateway is registered.";
    for (const provider of providers) {
      const card = document.createElement("article"); card.className = "zv-card provider";
      const header = document.createElement("div"); header.className = "row";
      header.append(text("strong", provider.name), text("span", provider.checkoutSupported ? "Hosted checkout supported" : "Hosted checkout unavailable"));
      const controls = document.createElement("div"); controls.className = "webhook";
      const field = document.createElement("input"); field.readOnly = true; field.setAttribute("aria-label", `${provider.name} webhook address`);
      field.value = provider.webhookPath; const copy = text("button", "Copy webhook address"); copy.className = "zv-button";
      copy.addEventListener("click", () => { field.select(); copy.textContent = document.execCommand("copy") ? "Copied" : "Select and copy the address"; });
      controls.append(field, copy); card.append(header, controls); el("active").append(card);
    }
    el("catalogue-hint").textContent = plugins.length ? "Payment plugins on this installation." : "No payment plugins are available.";
    for (const plugin of plugins) { const row = document.createElement("div"); row.className = "row"; row.append(text("span", plugin.title), text("span", plugin.status)); el("catalogue").append(row); }
  }).pipe(Effect.catch(showError("active-hint"))));
  let after;
  const failures = () => Effect.gen(function* () {
    const page = yield* api(`fulfillment/failures${after ? `?after=${encodeURIComponent(after)}` : ""}`);
    el("failures-hint").textContent = page.deliveries.length || after ? "Failed deliveries retry automatically." : "No fulfillment failures.";
    for (const delivery of page.deliveries) el("failures").append(text("p", `${delivery.handler}: ${delivery.lastError} Attempts: ${delivery.attempts}. Next attempt: ${new Date(delivery.nextAttemptAt).toLocaleString()}`));
    after = page.next; el("more").hidden = !after;
  }).pipe(Effect.catch(showError("failures-hint")));
  el("more").addEventListener("click", () => Effect.runFork(failures()));
  Effect.runFork(failures());
</script>
</body>
</html>
