<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hosting subscriptions</title><link rel="stylesheet" href="./hosting.css">
</head>
<body>
<main class="zv-stack" data-hosting-page="subscriptions">
  <section class="zv-card zv-stack">
    <p id="subscriptions-status" class="hosting-status" role="status">Loading subscriptions…</p>
    <div class="hosting-table">
      <table>
        <thead><tr><th scope="col">Account</th><th scope="col">Plan</th><th scope="col">State</th><th scope="col">Projects</th><th scope="col">Grace ends</th></tr></thead>
        <tbody id="subscriptions"></tbody>
      </table>
    </div>
    <button class="zv-button" id="more" type="button" hidden>Load more</button>
  </section>
</main>
<script type="module" src="./hosting.js"></script>
</body>
</html>
