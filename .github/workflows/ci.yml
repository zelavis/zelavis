name: CI

# Zero paid GitHub usage: standard Ubuntu runners in this public repository,
# no Actions artifacts, and no dependency caches. See AGENTS.md and
# .agents/references/github-zero-spend.md before changing that policy.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
  # Identifier for the dashboard e2e Platform owner. Its token and password are
  # generated per run; see "Generate ephemeral e2e credentials".
  ZELAVIS_E2E_OWNER_EMAIL: "ci@example.com"

on:
  push:
    branches:
      - main
  pull_request:
  # So a run can be started by hand — after a quota reset, a runner outage, or
  # any other time the interesting question is whether CI works at all.
  workflow_dispatch:

# One run per branch. Pushing again supersedes the run in flight rather than
# leaving it to finish work nobody will read, which is both faster feedback and
# less runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Typecheck and runtime tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace typechecks and Zelavis runtime tests
        run: pnpm ci:runtime

      - name: Validate distribution contracts
        run: pnpm distribution:test

      - name: Check docs and the public installer output
        run: |
          pnpm run docs:check
          pnpm run website:typecheck
          cmp distribution/installers/install.sh website/dist/install.sh

  ui:
    name: Dashboard browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @zelavis/ui exec playwright install --with-deps chromium

      - name: Build runtime packages for the browser checks
        run: |
          pnpm --filter zelavis build:runtime
          # The Platform does not build the dashboard for you; anything composing a frontend builds it explicitly.
          # No Fuzor checkout exists here, so this builds against the pinned Fuzor from npm.
          pnpm --filter @zelavis/ui build

      # The checks start their own throwaway Platforms with generated credentials and fresh data directories:
      # first-owner and login gates, the embedded production bundle at the mount path, every route at desktop and
      # mobile sizes, and the database workspace.
      - name: Run the dashboard browser checks
        run: pnpm ci:ui

  wordpress-provisioning:
    name: WordPress provisioning
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages for packaged installation
        run: pnpm build

      # The packaged system installation uses a root host Agent and an
      # unprivileged zelavis service account. The harness checks both paths in
      # one disposable Debian/systemd container; no host services are changed.
      - name: Qualify packaged WordPress installation
        run: zelavis-services/wordpress/scripts/wordpress-provisioning-container.sh

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail on moderate-or-higher known vulnerabilities
        run: pnpm audit:security
