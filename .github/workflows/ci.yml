name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"
  # Identifier for the dashboard e2e Platform owner. Its token and password are
  # generated per run; see "Generate ephemeral e2e credentials".
  ZELAVIS_E2E_OWNER_EMAIL: "ci@example.com"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  runtime:
    name: Typecheck and runtime tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace typechecks and Zelavis runtime tests
        run: pnpm ci:runtime

      - name: Validate distribution contracts
        run: pnpm distribution:test

  ui:
    name: Dashboard e2e
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @zelavis/ui exec playwright install --with-deps chromium

      - name: Build runtime packages for e2e
        run: |
          pnpm --filter zelavis build:runtime
          # The Platform no longer builds the dashboard for you — it does not
          # depend on it. Anything composing a frontend builds it explicitly.
          pnpm --filter @zelavis/ui build

      # The e2e Platform is created empty and destroyed with the runner, so
      # these are throwaway fixtures rather than credentials. Generating them
      # per run keeps credential-shaped literals out of the repository and
      # still works on pull requests from forks, which receive no secrets.
      - name: Generate ephemeral e2e credentials
        run: |
          echo "ZELAVIS_BOOTSTRAP_TOKEN=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "ZELAVIS_E2E_OWNER_PASSWORD=$(openssl rand -hex 12)" >> "$GITHUB_ENV"

      - name: Start example runtime server
        run: |
          pnpm --filter @zelavis/example-nodejs dev > /tmp/zelavis-runtime.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:3000/zelavis; then
              echo "Runtime server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Runtime server failed to start"
          cat /tmp/zelavis-runtime.log
          exit 1

      # Privileged control-plane endpoints require a real principal, so the
      # e2e run claims the first owner and uses its session.
      - name: Bootstrap the Platform owner
        run: |
          curl --fail --show-error --silent \
            --request POST \
            --header "content-type: application/json" \
            --data "{\"bootstrapToken\":\"$ZELAVIS_BOOTSTRAP_TOKEN\",\"provider\":\"password\",\"account\":{\"email\":\"ci@example.com\",\"displayName\":\"Zelavis E2E\"},\"credential\":{\"identifier\":\"ci@example.com\",\"password\":\"$ZELAVIS_E2E_OWNER_PASSWORD\"}}" \
            http://127.0.0.1:3000/zelavis/api/v1/auth/bootstrap > /tmp/zelavis-owner.json
          echo "ZELAVIS_E2E_SESSION_TOKEN=$(node -p "require('/tmp/zelavis-owner.json').session.token")" >> "$GITHUB_ENV"

      - name: Create isolated dashboard test project
        run: |
          curl --fail --show-error \
            --request POST \
            --header "content-type: application/json" \
            --header "authorization: Bearer $ZELAVIS_E2E_SESSION_TOKEN" \
            --data '{"id":"dashboard-e2e","name":"Zelavis Runtime","start":true}' \
            http://127.0.0.1:3000/zelavis/api/v1/runtime/projects

      - name: Run mounted desktop dashboard e2e
        run: pnpm ci:ui

  wordpress-provisioning:
    name: WordPress provisioning from a bare host
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Driven through Docker rather than a `container:` job. The check needs a
      # host with nginx, PHP and MariaDB absent — which the runner image is not
      # — and it needs to run as an ordinary user with passwordless sudo, which
      # means installing sudo and creating that user as root first. A
      # `container:` job runs every step as one user and cannot do both.
      - name: Install WordPress from nothing
        run: packages/zelavis/scripts/wordpress-provisioning-container.sh

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail on moderate-or-higher known vulnerabilities
        run: pnpm audit:security
