name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  runtime:
    name: Typecheck and runtime tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace typechecks and Zelavis runtime tests
        run: pnpm ci:runtime

  ui:
    name: Dashboard e2e
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @zelavis/ui exec playwright install --with-deps chromium

      - name: Build runtime packages for e2e
        run: pnpm --filter @zelavis/server build && pnpm --filter @zelavis/db build && pnpm --filter @zelavis/db-node-sqlite build && pnpm --filter @zelavis/db-bun-sqlite build && pnpm --filter @zelavis/db-cloudflare-d1 build && pnpm --filter @zelavis/auth build && pnpm --filter @zelavis/ui build:plugin && pnpm --filter zelavis build:runtime

      - name: Start example runtime server
        run: |
          pnpm --filter @zelavis/example-nodejs dev > /tmp/zelavis-runtime.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:3000/zelavis; then
              echo "Runtime server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Runtime server failed to start"
          cat /tmp/zelavis-runtime.log
          exit 1

      - name: Run mounted desktop dashboard e2e
        run: pnpm ci:ui

  security:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail on moderate-or-higher known vulnerabilities
        run: pnpm audit:security
