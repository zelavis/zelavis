name: Distribution artifacts

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PNPM_CONFIG_MINIMUM_RELEASE_AGE: "0"

on:
  workflow_dispatch:
  push:
    tags:
      # `changeset publish` tags the root package as `zelavis@<version>`, and
      # that is the only tag a release actually creates. Listening for `v*`
      # alone meant the release path in use could never trigger this workflow:
      # no artifacts, and no error either, because a tag that matches nothing
      # simply does not start a run.
      #
      # `*` does not match `/`, so `zelavis@*` covers the root package without
      # catching the scoped `@zelavis/<name>@<version>` tags — otherwise every
      # plugin and adapter publish would build all four targets too.
      #
      # `v*` is kept so a hand-cut release tag still works.
      - "v*"
      - "zelavis@*"

jobs:
  package:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: darwin-x64
            runner: macos-15-intel
          - target: darwin-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the runtime used by distribution contracts
        run: pnpm --filter zelavis build

      - name: Validate distribution contracts
        run: pnpm distribution:test

      - name: Build target-native release artifacts
        env:
          # Host operations shipped in distribution/operations are signed with
          # the release key. Tag builds must sign them; manual builds without
          # the secret omit them rather than shipping unsigned operations.
          ZELAVIS_OPERATION_SIGNING_KEY: ${{ secrets.ZELAVIS_OPERATION_SIGNING_KEY }}
          ZELAVIS_OPERATION_SIGNING_KEY_ID: ${{ secrets.ZELAVIS_OPERATION_SIGNING_KEY_ID }}
          ZELAVIS_SKIP_UNSIGNED_OPERATIONS: ${{ startsWith(github.ref, 'refs/tags/') && '0' || '1' }}
        run: pnpm distribution:build

      - name: Smoke-test packaged CLI
        shell: bash
        run: |
          distribution/.tmp/stage/bin/zelavis --version
          test "$(distribution/.tmp/stage/runtime/node/bin/node --version)" = "v$(node -p "require('./distribution/release.json').nodeVersion")"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: zelavis-${{ matrix.target }}
          path: distribution/artifacts/*
          if-no-files-found: error
