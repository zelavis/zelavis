version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 10
    exclude-paths:
      - "repos/effect/**"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      tailwind:
        patterns:
          - "@tailwindcss/*"
          - "tailwindcss"
      playwright:
        patterns:
          - "@playwright/test"
      react:
        patterns:
          - "react"
          - "react-dom"
      runtime-adapters:
        patterns:
          - "hono"
          - "express"
          - "fastify"
          - "h3"
          - "elysia"
          - "next"
      payments:
        patterns:
          - "@paypal/paypal-server-sdk"
          - "stripe"
      # Each of these families ships in lockstep and shares types across its
      # packages. Bumped one PR at a time, two copies end up installed and the
      # dashboard stops building: lexical 0.51 and @assistant-ui/core 0.3.19
      # each did in September 2026. One PR per family moves them together.
      lexical:
        patterns:
          - "lexical"
          - "@lexical/*"
      assistant-ui:
        patterns:
          - "@assistant-ui/*"
          - "assistant-cloud"
          - "assistant-stream"
      react-router:
        patterns:
          - "react-router"
          - "@react-router/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
