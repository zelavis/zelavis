version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 10
    exclude-paths:
      - "repos/effect/**"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
      tailwind:
        patterns:
          - "@tailwindcss/*"
          - "tailwindcss"
      playwright:
        patterns:
          - "@playwright/test"
      react:
        patterns:
          - "react"
          - "react-dom"
      runtime-adapters:
        patterns:
          - "hono"
          - "express"
          - "fastify"
          - "h3"
          - "elysia"
          - "next"
      payments:
        patterns:
          - "@paypal/paypal-server-sdk"
          - "stripe"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
