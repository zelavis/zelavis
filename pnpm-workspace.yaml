packages:
  - "packages/*"
  - "packages/zelavis/product-services/*"
  - "packages/zelavis/product-services/*/adapters/*"
  - "packages/zelavis/product-services/*/plugins/*"
  - "plugins/*"
  - "plugins/*/adapters/*"
  - "plugins/*/plugins/*"
  - "packages/*/adapters/*"
  - "packages/*/plugins/*"
  - "examples/*"
  - "website"

overrides:
  axios: ^1.15.2
  brace-expansion: ^5.0.6
  fast-uri: 3.1.2
  follow-redirects: ^1.16.0
  hono: ^4.12.18
  ip-address: 10.1.1
  path-to-regexp: ^8.4.0
  postcss: ^8.5.10
  react: 19.2.5
  react-dom: 19.2.5

auditConfig:
  ignoreGhsas:
    - GHSA-rmmr-r34h-pfm5

allowBuilds:
  better-sqlite3: true
  esbuild: true
  lightningcss: true
  msgpackr-extract: true
  msw: true
  sharp: true
  unrs-resolver: true
