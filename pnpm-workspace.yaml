packages:
  - "packages/*"
  - "packages/zelavis/services/*"
  - "packages/zelavis/services/*/adapters/*"
  - "packages/zelavis/services/*/plugins/*"
  - "plugins/*"
  - "plugins/*/adapters/*"
  - "plugins/*/plugins/*"
  - "packages/*/adapters/*"
  - "packages/*/plugins/*"
  - "examples/*"
  - "website"

overrides:
  # Every codemirror sub-package resolved its own older copy of these two
  # while the dashboard's direct dependency resolved a newer one, so an
  # `EditorView` from one copy was not the `EditorView` the other's types
  # named and the editor stopped typechecking. They are peer dependencies
  # of the whole family: there has to be exactly one of each.
  '@codemirror/state': ^6.7.4
  '@codemirror/view': ^6.43.11
  '@hono/node-server': ^1.19.15
  axios: ^1.18.0
  body-parser@1: ^1.20.6
  body-parser@2: ^2.3.0
  brace-expansion: ^5.0.9
  esbuild: ^0.28.2
  fast-uri: ^3.1.5
  follow-redirects: ^1.16.0
  form-data: ^4.0.6
  hono: ^4.12.18
  ip-address: ^10.3.1
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
  morgan: ^1.10.2
  nanoid: ^3.3.18
  path-to-regexp: ^8.4.0
  postcss: ^8.5.23
  react: 19.2.5
  react-dom: 19.2.5
  sharp: ^0.35.3
  svgo: ^4.0.2
  valibot: ^1.4.2

auditConfig:
  ignoreGhsas:
    - GHSA-rmmr-r34h-pfm5

allowBuilds:
  better-sqlite3: true
  esbuild: true
  lightningcss: true
  lmdb: true
  msgpackr-extract: true
  msw: true
  # Denied rather than omitted: pnpm refuses an install that silently ignores a
  # build script, so the decision has to be written down either way.
  #
  # rocksdb ships no prebuilt binary for the Node this repository runs, so pnpm
  # compiles it from source, and its bundled C++ does not build against the
  # toolchain on Linux CI — which failed `pnpm install` itself, before any of
  # this repository's own code ran. It stays an optional peer: a host that wants
  # the engine installs and builds it deliberately, and the tests skip it when
  # it is absent.
  rocksdb: false
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - esbuild@0.28.2
  - form-data@4.0.6
  - morgan@1.10.2
  - axios@1.18.0
  - body-parser@2.3.0
  - body-parser@1.20.6
  - fast-uri@3.1.5
  - sharp@0.35.3
  - valibot@1.4.2
  - postcss@8.5.23
  - ip-address@10.3.1
  - brace-expansion@5.0.9
  - js-yaml@3.15.1
  - js-yaml@4.3.1
  - '@hono/node-server@1.19.15'
  - astro@7.1.1
  - nanoid@3.3.18
  - svgo@4.0.2
  - '@effect/tsgo-darwin-arm64@0.43.0'
  - '@effect/tsgo-darwin-x64@0.43.0'
  - '@effect/tsgo-linux-arm64@0.43.0'
  - '@effect/tsgo-linux-arm@0.43.0'
  - '@effect/tsgo-linux-x64@0.43.0'
  - '@effect/tsgo-win32-arm64@0.43.0'
  - '@effect/tsgo-win32-x64@0.43.0'
  - '@effect/tsgo@0.43.0'
