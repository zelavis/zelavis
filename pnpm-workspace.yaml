packages:
  - "packages/*"
  - "packages/zelavis/services/*"
  - "packages/zelavis/services/*/adapters/*"
  - "packages/zelavis/services/*/plugins/*"
  - "plugins/*"
  - "plugins/*/adapters/*"
  - "plugins/*/plugins/*"
  - "packages/*/adapters/*"
  - "packages/*/plugins/*"
  - "examples/*"
  - "website"

overrides:
  '@hono/node-server': ^1.19.15
  axios: ^1.18.0
  body-parser@1: ^1.20.6
  body-parser@2: ^2.3.0
  brace-expansion: ^5.0.9
  esbuild: ^0.28.2
  fast-uri: ^3.1.5
  follow-redirects: ^1.16.0
  form-data: ^4.0.6
  hono: ^4.12.18
  ip-address: ^10.3.1
  js-yaml@3: ^3.15.1
  js-yaml@4: ^4.3.1
  morgan: ^1.10.2
  nanoid: ^3.3.18
  path-to-regexp: ^8.4.0
  postcss: ^8.5.23
  react: 19.2.5
  react-dom: 19.2.5
  sharp: ^0.35.3
  svgo: ^4.0.2
  valibot: ^1.4.2

auditConfig:
  ignoreGhsas:
    - GHSA-rmmr-r34h-pfm5

allowBuilds:
  better-sqlite3: true
  esbuild: true
  lightningcss: true
  msgpackr-extract: true
  msw: true
  rocksdb: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - esbuild@0.28.2
  - form-data@4.0.6
  - morgan@1.10.2
  - axios@1.18.0
  - body-parser@2.3.0
  - body-parser@1.20.6
  - fast-uri@3.1.5
  - sharp@0.35.3
  - valibot@1.4.2
  - postcss@8.5.23
  - ip-address@10.3.1
  - brace-expansion@5.0.9
  - js-yaml@3.15.1
  - js-yaml@4.3.1
  - '@hono/node-server@1.19.15'
  - astro@7.1.1
  - nanoid@3.3.18
  - svgo@4.0.2
