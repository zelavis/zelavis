<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example Basic Service</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: Canvas;
        color: CanvasText;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      main {
        display: grid;
        gap: 20px;
        max-width: 760px;
      }

      h1,
      p {
        margin: 0;
      }

      .eyebrow {
        color: color-mix(in srgb, CanvasText 58%, transparent);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .panel {
        display: grid;
        gap: 12px;
        border: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
        border-radius: 8px;
        padding: 18px;
        background: color-mix(in srgb, Canvas 94%, CanvasText 6%);
      }

      code {
        overflow-wrap: anywhere;
        border-radius: 6px;
        background: color-mix(in srgb, CanvasText 9%, transparent);
        padding: 2px 6px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Uploaded service</p>
      <h1>Example Basic Service</h1>
      <p>
        This page is a bundled static HTML entry loaded through the Zelavis
        service iframe boundary.
      </p>
      <section class="panel">
        <h2>Runtime checks</h2>
        <p>Service API: <code>/zelavis/api/v1/example-basic/health</code></p>
      </section>
    </main>
  </body>
</html>
