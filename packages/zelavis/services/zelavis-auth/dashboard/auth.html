<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auth</title>
    <link rel="stylesheet" href="../../../service-page.css" />
    <style>
      .grid { display: grid; gap: 0.75rem; }
      .row {
        display: flex;
        gap: 0.75rem;
        align-items: baseline;
        justify-content: space-between;
        flex-wrap: wrap;
      }
      .name { font-weight: 600; }
      .empty { color: var(--muted-foreground); }
      .error { border-color: var(--destructive); color: var(--destructive); }
      .tag {
        font-size: 0.75rem;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 0.05rem 0.5rem;
        color: var(--muted-foreground);
      }
      form { display: grid; gap: 0.5rem; }
      .fields { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      #registration-form label { display: flex; gap: 0.5rem; align-items: center; }
      #registration-form input { flex: none; }
      input {
        font: inherit;
        flex: 1 1 14rem;
        padding: 0.375rem 0.625rem;
        border-radius: 0.5rem;
        border: 1px solid var(--border);
        background: var(--background);
        color: var(--foreground);
      }
    </style>
  </head>
  <body>
    <main class="zv-stack">
      <section class="zv-card zv-stack">
        <div>
          <h2>Sign-in</h2>
          <p class="zv-muted" id="providers-hint">Loading…</p>
        </div>
        <div class="grid" id="providers"></div>
      </section>

      <section class="zv-card zv-stack">
        <h2>Public registration</h2>
        <form id="registration-form">
          <label><input id="registration-enabled" type="checkbox" disabled /> Allow public registration</label>
          <div><button id="registration-save" class="zv-button" type="submit" disabled>Save</button></div>
        </form>
        <p id="registration-status" class="zv-muted" role="status">Loading…</p>
      </section>

      <section class="zv-card zv-stack">
        <div>
          <h2>Single sign-on</h2>
          <p class="zv-muted">
            Paste an OpenID Connect issuer to add a provider. Zelavis reads its
            endpoints from the issuer itself, so nothing has to be installed
            first.
          </p>
        </div>
        <form id="connect">
          <div class="fields">
            <input id="provider" placeholder="name, e.g. acme" aria-label="Provider name" required />
            <input id="issuer" placeholder="https://id.example.com" aria-label="Issuer URL" />
          </div>
          <div class="fields">
            <input id="clientId" placeholder="client id" aria-label="Client id" required />
            <input id="clientSecret" type="password" placeholder="client secret" aria-label="Client secret" />
          </div>
          <div class="fields">
            <input id="redirectUri" placeholder="https://example.com/…/callback" aria-label="Redirect URI" required />
            <button class="zv-button" type="submit">Save</button>
          </div>
        </form>
        <p id="connect-status" class="zv-muted" role="status" hidden></p>
        <div class="grid" id="connections"></div>
      </section>

      <section class="zv-card zv-stack">
        <h2>Passkeys</h2>
        <form id="passkey-form">
          <label>Relying-party ID <input id="rp-id" required /></label>
          <label>Relying-party name <input id="rp-name" required /></label>
          <label>Allowed origins, comma-separated <input id="passkey-origins" required /></label>
          <div><button class="zv-button" type="submit">Save passkey settings</button></div>
        </form>
        <p id="passkey-status" role="status"></p>
      </section>
      <section class="zv-card zv-stack">
        <h2>Multi-factor authentication</h2>
        <form id="policy-form">
          <label>Require MFA for
            <select id="required-for"><option value="none">No accounts</option><option value="privileged">Privileged accounts</option><option value="all">All accounts</option></select>
          </label>
          <div><button class="zv-button" type="submit">Save MFA policy</button></div>
        </form>
        <p id="policy-status" role="status"></p>
      </section>
      <section class="zv-card zv-stack">
        <h2>Signing keys</h2>
        <button id="rotate-key" type="button" class="zv-button">Rotate signing key</button>
        <p id="key-status" role="status"></p>
      </section>
      <section class="zv-card zv-stack">
        <div>
          <h2>Auth plugins</h2>
          <p class="zv-muted" id="extensions-hint">Loading…</p>
        </div>
        <div class="grid" id="extensions"></div>
      </section>
    </main>

    <script type="module">
      // Four levels up from /runtime/service-page-assets/<service>/<bundle>/<file>
      // is the API root this page was served from.
      const apiRoot = new URL("../../../../", location.href).pathname.replace(/\/$/, "");
      const OWNER = "zelavis/auth";

      const el = (id) => document.getElementById(id);

      async function api(path, init) {
        const response = await fetch(apiRoot + path, {
          headers: { accept: "application/json", ...(init?.headers ?? {}) },
          ...init,
        });
        const text = await response.text();
        const body = text ? JSON.parse(text) : undefined;
        if (!response.ok) {
          throw Object.assign(new Error(body?.error ?? `Request failed (${response.status})`), { code: body?.code });
        }
        return body;
      }

      const registrationPath = "/auth/registration/settings";
      const registrationEnabled = el("registration-enabled");
      const registrationSave = el("registration-save");
      const registrationStatus = el("registration-status");
      let registration;

      function showRegistration(settings, notice) {
        if (typeof settings?.enabled !== "boolean" || !Number.isSafeInteger(settings.revision) || settings.revision < 0) {
          throw new Error("The runtime returned invalid registration settings.");
        }
        registration = settings;
        registrationEnabled.checked = settings.enabled;
        registrationEnabled.disabled = false;
        registrationSave.disabled = true;
        registrationStatus.textContent = notice ?? (settings.enabled ? "Registration is open." : "Registration is closed.");
      }

      async function renderRegistration(notice) {
        try {
          showRegistration(await api(registrationPath), notice);
        } catch (cause) {
          registrationStatus.textContent = cause.message;
        }
      }

      const registrationChanged = () => {
        registrationSave.disabled = !registration || registrationEnabled.checked === registration.enabled;
      };
      registrationEnabled.addEventListener("change", registrationChanged);
      el("registration-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!registration || registrationSave.disabled) return;
        registrationEnabled.disabled = true;
        registrationSave.disabled = true;
        registrationStatus.textContent = "Saving…";
        try {
          const saved = await api(registrationPath, {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ enabled: registrationEnabled.checked, expectedRevision: registration.revision }),
          });
          const notice = saved.enabled ? "Registration opened." : "Registration closed.";
          showRegistration(saved, notice);
        } catch (cause) {
          registration = undefined;
          const notice = cause.code === "registration_settings_conflict"
            ? "Registration settings changed. Review the current setting and try again."
            : cause.message;
          await renderRegistration(notice);
        }
      });

      function card(children) {
        const row = document.createElement("div");
        row.className = "zv-card row";
        for (const child of children) row.append(child);
        return row;
      }

      function text(value, className) {
        const span = document.createElement("span");
        if (className) span.className = className;
        span.textContent = value;
        return span;
      }

      const json = (method, body) => ({
        method, headers: { "content-type": "application/json" }, body: JSON.stringify(body),
      });

      async function renderProviders() {
        const list = el("providers");
        const status = el("providers-hint");
        try {
          const [{ methods }, settings] = await Promise.all([api("/auth/methods"), api("/auth/methods/settings")]);
          const names = new Set([...settings.enabled, ...methods.map(method => method.name)]);
          const form = document.createElement("form");
          const save = document.createElement("button");
          save.className = "zv-button";
          save.textContent = "Save sign-in methods";
          for (const name of names) {
            const label = document.createElement("label");
            const check = document.createElement("input");
            check.type = "checkbox";
            check.name = "method";
            check.value = name;
            check.checked = settings.enabled.includes(name);
            label.append(check, " ", name.replace("oauth:", "OAuth: "));
            form.append(label);
          }
          form.append(save);
          form.addEventListener("submit", async event => {
            event.preventDefault();
            save.disabled = true;
            try {
              await api("/auth/methods/settings", json("PUT", {
                enabled: new FormData(form).getAll("method"), expectedRevision: settings.revision,
              }));
              await renderProviders();
              status.textContent = "Sign-in methods saved.";
            } catch (cause) {
              if (cause.code === "methods_settings_conflict") await renderProviders();
              status.textContent = cause.message;
            } finally {
              save.disabled = false;
            }
          });
          list.replaceChildren(form);
          status.textContent = "";
        } catch (cause) {
          status.textContent = cause.message;
        }
      }

      async function renderPolicy() {
        const status = el("policy-status");
        const form = el("policy-form");
        try {
          const policy = await api("/auth/mfa/policy");
          el("required-for").value = policy.requiredFor;
          form.onsubmit = async event => {
            event.preventDefault();
            try {
              await api("/auth/mfa/policy", json("PUT", {
                requiredFor: el("required-for").value, expectedRevision: policy.revision,
              }));
              await renderPolicy();
              status.textContent = "MFA policy saved.";
            } catch (cause) {
              await renderPolicy();
              status.textContent = cause.message;
            }
          };
        } catch (cause) {
          status.textContent = cause.message;
        }
      }

      async function renderPasskeys() {
        const status = el("passkey-status");
        const form = el("passkey-form");
        try {
          const settings = await api("/auth/passkeys/settings");
          el("rp-id").value = settings.rpId;
          el("rp-name").value = settings.rpName;
          el("passkey-origins").value = settings.origins.join(", ");
          form.onsubmit = async event => {
            event.preventDefault();
            try {
              await api("/auth/passkeys/settings", json("PUT", {
                rpId: el("rp-id").value, rpName: el("rp-name").value,
                origins: el("passkey-origins").value.split(",").map(value => value.trim()).filter(Boolean),
              }));
              await renderPasskeys();
              status.textContent = "Passkey settings saved.";
            } catch (cause) {
              status.textContent = cause.message;
            }
          };
        } catch (cause) {
          status.textContent = cause.message;
        }
      }

      el("rotate-key").addEventListener("click", async () => {
        const control = el("rotate-key");
        control.disabled = true;
        try {
          await api("/auth/keys/rotate", json("POST", {}));
          el("key-status").textContent = "Signing key rotated.";
        } catch (cause) {
          el("key-status").textContent = cause.message;
        } finally {
          control.disabled = false;
        }
      });

      async function renderConnections() {
        const list = el("connections");
        list.replaceChildren();
        try {
          const { providers = [] } = await api("/auth/oauth/connections");
          for (const connection of providers) {
            const detail = connection.configured
              ? `${connection.clientId}${connection.hasClientSecret ? " · secret set" : ""}`
              : "not configured";
            list.append(
              card([
                text(connection.title ?? connection.provider, "name"),
                text(detail, "tag"),
              ]),
            );
          }
        } catch (cause) {
          list.append(text(cause.message, "empty error"));
        }
      }

      async function renderExtensions() {
        const list = el("extensions");
        list.replaceChildren();
        try {
          // Scoped to what extends auth. A general catalogue would list a
          // dashboard theme beside a sign-in method and mean nothing here.
          const { extensionPoints = [] } = await api(
            `/runtime/extensions?owner=${encodeURIComponent(OWNER)}`,
          );
          const point = extensionPoints[0];
          const extensions = point?.extensions ?? [];
          el("extensions-hint").textContent = extensions.length
            ? "Plugins that add sign-in methods to this installation."
            : "No auth plugins are registered on this installation.";
          for (const extension of extensions) {
            const action = document.createElement("button");
            action.className = "zv-button";
            const installed = extension.status === "installed";
            action.textContent = installed ? "Disable" : "Install";
            action.addEventListener("click", async () => {
              action.disabled = true;
              try {
                await api(
                  `/runtime/services/${encodeURIComponent(extension.name)}`,
                  {
                    method: "PATCH",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({
                      status: installed ? "available" : "installed",
                    }),
                  },
                );
                await renderExtensions();
                await renderConnections();
              } catch (cause) {
                action.disabled = false;
                action.textContent = cause.message;
              }
            });
            list.append(
              card([
                text(extension.marketplace?.title ?? extension.name, "name"),
                text(extension.status, "tag"),
                action,
              ]),
            );
          }
        } catch (cause) {
          el("extensions-hint").textContent = cause.message;
          el("extensions-hint").classList.add("error");
        }
      }

      el("connect").addEventListener("submit", async (event) => {
        event.preventDefault();
        const status = el("connect-status");
        status.hidden = false;
        status.classList.remove("error");
        status.textContent = "Saving…";
        try {
          const provider = el("provider").value.trim();
          await api(`/auth/oauth/connections/${encodeURIComponent(provider)}`, {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({
              ...(el("issuer").value.trim()
                ? { issuer: el("issuer").value.trim() }
                : {}),
              clientId: el("clientId").value.trim(),
              // Omitted when blank, which keeps whatever is stored: the API
              // never returns a secret, so there is nothing to type back.
              ...(el("clientSecret").value
                ? { clientSecret: el("clientSecret").value }
                : {}),
              redirectUri: el("redirectUri").value.trim(),
            }),
          });
          status.textContent = `Saved ${provider}.`;
          el("clientSecret").value = "";
          await renderConnections();
        } catch (cause) {
          status.textContent = cause.message;
          status.classList.add("error");
        }
      });

      await Promise.all([renderProviders(), renderRegistration(), renderConnections(), renderExtensions(), renderPolicy(), renderPasskeys()]);
    </script>
  </body>
</html>
